# Development Configuration
# Used for local development with debug enabled and convenient defaults

environment: development
project_root: "."

database:
  url: "sqlite:///agency_toolkit.db"
  echo: true
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600
  auto_create_tables: true

api:
  host: "localhost"
  port: 8000
  debug: true
  workers: 1
  reload: true
  access_log: true
  cors_origins:
    - "*"

shell:
  timeout: 300
  max_output_lines: 5000
  respect_gitignore: true
  retry_on_timeout: true
  max_retries: 2

logging:
  level: "DEBUG"
  format: "console"
  log_file: null
  max_file_size: 10485760
  backup_count: 3

security:
  enable_constitutional_validation: true
  audit_log_retention_days: 7
  max_session_duration_hours: 24

performance:
  enable_caching: true
  max_concurrent_operations: 10
  max_worker_threads: 4

cache:
  backend: "memory"
  ttl_seconds: 300
  max_size: 1000
  prefix: "agency_"

task:
  max_workers: 2
  queue_size: 100
  retry_attempts: 1
  retry_delay_seconds: 5
  timeout_seconds: 300
