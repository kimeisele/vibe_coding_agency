  teil_2:
    titel: "Die Client-Registry: Abstraktion Regionaler Client-Archetypen"
    einleitung: |
      Basierend auf der Marktanalyse in Teil 1 werden die konkreten Kundenportfolios 8 analysiert, um Muster zu identifizieren. Diese Muster, basierend auf Branche, Unternehmensgröße und impliziten Marketingzielen, werden zu generalisierten "Client-Archetypen" abstrahiert. Diese Registry bildet den ersten Kernbaustein des 'GRAND AGENCY' Betriebssystems.
    archetypen:
      - id: "I"
        name: "Der Hyper-Lokale (Handwerk, Lokale Dienstleister & KMU)"
        datengrundlage: |
          Dieser Archetyp wird primär aus dem expliziten Portfolio von atimedia 12 (z.B. Spenglerfuchs, Schreinerei Riedhofer, Haustechnik Körner, Kaspar Huber GmbH, A. Bauer Elektromaschinenbau, piano-peter-komlew.de) und dem impliziten Kundenstamm von GS Werbung 6 (Kunden für "Beschriftung") abgeleitet. Auch Concorde Media 4 zielt auf diesen Sektor.
        merkmale: |
          Inhabergeführte Betriebe (1-50 Mitarbeiter), stark lokal oder regional verwurzelt. Marketing wird oft reaktiv oder "nebenbei" durch die Geschäftsführung betrieben. Die Budgets sind gering bis mittel, der Fokus liegt auf konkreter, lokaler Auffindbarkeit und der Stärkung der Reputation.
        typische_pain_points: |
          Ein akuter Mangel an Zeit für Marketing 18, limitierte Budgets 18 und ein Mangel an digitaler Sichtbarkeit 19 sind die Hauptprobleme. Der dominanteste Pain Point ist jedoch der akute Fachkräftemangel und die Schwierigkeit, Auszubildende zu finden.20

      - id: "II"
        name: "Der Erlebnis-Anbieter (Tourismus, Hotellerie & Gastronomie)"
        datengrundlage: |
          Dieser Archetyp ist in der EuRegio stark vertreten und wird durch Kunden verschiedener Agenturen validiert: makrohaus 8 (Hotel Seeblick), atimedia 12 (Villa Sudrow Apartments, Berggasthof Neureuth, Mais-Thai-Küche, Hotel Bockmaier), Adwerba 13 (Gut Brandlhof, Salzburger Seenland, Tourismus Salzburg, Aktivhotel FIRSTpeak, Sonja Alpine Resort, Schloss Leopoldskron) und oha.digital 16 (Die Weisse).
        merkmale: |
          Ein hochgradig wettbewerbsintensiver Markt, der stark saisonabhängig ist.22 Das Produkt ist ein immaterielles "Erlebnis", dessen Vermarktung extrem von hochwertiger visueller Darstellung (Fotos, Videos) und Reputation (Bewertungen) abhängt. Der Buchungsprozess (Booking Engine) ist ein kritischer Erfolgsfaktor.23
        typische_pain_points: |
          Starke Abhängigkeit von externen Buchungsplattformen (OTAs) und deren Provisionen.24 Die Notwendigkeit, sich in einem gesättigten Markt durch einen klaren USP (Alleinstellungsmerkmal) zu differenzieren.25 In der Region kommt hinzu, dass der Tourismus (insbesondere Tagestourismus) zu Unmut bei Anwohnern führt ("Overtourism"), was eine sensible Kommunikationsstrategie erfordert.26

      - id: "III"
        name: "Der Industrie-Partner (Internationales B2B, Hersteller & Logistik)"
        datengrundlage: |
          Dieser Archetyp wird fast ausschließlich von den größeren Agenturen im Ökosystem bedient: Adwerba 13 (SKIDATA, Lenzing AG, Quehenberger Logistics, Allgemeine Bau-Chemie, Sturm GmbH), schoko-seite 9 (Transportbeton Traunstein) und oha.digital 16 (W&M Holding).
        merkmale: |
          Klarer B2B-Fokus.27 Die Zielgruppe besteht nicht aus Endkonsommenten, sondern aus Fachentscheidern (z.B. Ingenieure, Einkäufer, Projektleiter). Dies führt zu langen Verkaufszyklen (long sales cycles). Marketing dient nicht dem Impulskauf, sondern dem Aufbau von Expertise und Vertrauen. Lead-Generierung ist das primäre Ziel.28
        typische_pain_points: |
          Ein Mangel an qualifizierten Leads für das Vertriebsteam.28 Die Notwendigkeit, komplexe, technische Produkte oder Dienstleistungen verständlich und nutzenorientiert zu erklären.30 Es fehlt an "Thought Leadership" (Vordenkerrolle), um sich als Experte im Markt zu positionieren.31

      - id: "IV"
        name: "Der Frequenzbringer (Lokaler & Nationaler Einzelhandel)"
        datengrundlage: |
          Abgeleitet von den Kundenportfolios von makrohaus 8 (Früchte Maier, Reber Spezialitäten) und Adwerba 13 (SPAR ICS, Étienne Salzburg, Zuckerlwerkstatt).
        merkmale: |
          Ein physischer Point-of-Sale (POS) ist der Kern des Geschäftsmodells. Das Marketing kämpft um "Foot Traffic" (Laufkundschaft) 32 und steht in direkter Konkurrenz zum E-Commerce. Es besteht ein hoher Bedarf an lokaler digitaler Sichtbarkeit und oft schnellen, kampagnengetriebenen Angeboten.
        typische_pain_points: |
          Die massive Konkurrenz durch den E-Commerce.32 Eine mangelnde Sichtbarkeit in der lokalen Suche (insbesondere bei "in der Nähe"-Anfragen via Smartphone).34 Oft fehlt eine kohärente Local-SEO-Strategie.19

      - id: "V"
        name: "Die Öffentliche Stimme (Kommunen, Verbände, Kultur & NGOs)"
        datengrundlage: |
          Dieser diverse Archetyp wird durch Kunden wie das European Forum Alpbach (von oha.digital 16), die Kunstakademie Reichenhall und Triathlon Austria (von schoko-seite 9) sowie den Verein Freunde des historischen Lokschuppens 1905 Freilassing e.V. und die CSU Oberpframmern (von atimedia 12) belegt.
        merkmale: |
          Die Zielgruppe sind "Bürger" oder "Mitglieder", nicht "Kunden". Die Organisationen sind oft Non-Profit. Marketingziele sind Information, Bürger-Engagement, Mitgliedergewinnung, Spendenakquise oder Standortmarketing. Die Stakeholder-Struktur ist oft komplex (Politik, Verwaltung, Mitglieder).
        typische_pain_points: |
          Wichtige Informationen erreichen die Bürger oder Mitglieder nicht.35 Veraltete Web-Auftritte genügen nicht den modernen Anforderungen an Bürgerservice oder Barrierefreiheit.36 Bei Vereinen steht der Mitgliederschwund und die schwierige Gewinnung von Ehrenamtlichen im Vordergrund.37 In der Verwaltung herrscht zudem ein eigener Fachkräftemangel.38

      - id: "VI"
        name: "Die Global Brand (Internationale Konzerne mit lokalem Bedarf)"
        datengrundlage: |
          Dieser Archetyp wird exklusiv und eindrucksvoll durch das Portfolio von Adwerba 13 definiert: Red Bull, BMW, MINI, Miele, American Express, Nespresso.
        merkmale: |
          Die Marketing-Hauptstrategie wird global oder national vorgegeben. Es existieren lokale Marketingbudgets für die Adaption und Umsetzung dieser Strategien. Es bestehen extrem hohe, unnachgiebige Anforderungen an die Einhaltung des Corporate Designs (CD) und der Brand-Compliance. Der Fokus liegt auf dem fehlerfreien Rollout von Kampagnen und der High-End-Produktion von Werbemitteln (z.B. komplexe Mailings, Event-Ausstattungen).13
        typische_pain_points: |
          Die größte Herausforderung ist die Auswahl einer lokalen Agentur, die globale CD-Vorgaben versteht, präzise umsetzen kann und die Skalierbarkeit für internationale Kampagnen-Rollouts sowie eine fehlerfreie High-End-Produktion von Werbemitteln garantiert.

