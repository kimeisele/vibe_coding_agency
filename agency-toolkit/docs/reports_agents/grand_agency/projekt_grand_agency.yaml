projekt_grand_agency:
  titel: "Projekt 'GRAND AGENCY': Registry der Client-Archetypen und Lösungs-Templates für die EuRegio Salzburg-BGL"

  teil_1:
    titel: "Marktanalyse des Agentur-Ökosystems (Bad Reichenhall / Freilassing / Salzburg)"
    einleitung: |
      Die Erstellung eines "Betriebssystems" für Agentur-Workflows, wie es das Projekt 'GRAND AGENCY' vorsieht, erfordert eine fundierte Datengrundlage. Diese Grundlage wird durch eine tiefgehende Analyse des bestehenden Agenturmarktes und dessen Klientel in der Zielregion geschaffen. Die EuRegio Salzburg – Berchtesgadener Land – Traunstein 1 bildet einen eng verwobenen Wirtschaftsraum, der jedoch von zwei distinkten Agentur-Ökosystemen bedient wird. Die Analyse dieser Ökosysteme – des deutschen Hubs (Bad Reichenhall/Freilassing) und des österreichischen Hubs (Salzburg) – offenbart das Spektrum der Nachfrage und des Angebots, das für die Abstraktion von Client-Archetypen und Lösungs-Templates notwendig ist.

    section_1_1:
      titel: "Agenturprofile: Der deutsche Hub (Bad Reichenhall & Freilassing)"
      beschreibung: |
        Der deutsche Teil der EuRegio, zentriert um Bad Reichenhall und Freilassing, ist geprägt von Agenturen, die sich auf die Betreuung kleiner und mittelständischer Unternehmen (KMU) spezialisiert haben. Das Service-Spektrum reicht von hyper-lokalen Grundbedürfnissen bis hin zu anspruchsvollen digitalen Lösungen.
      agenturen:
        - name: "Concorde Media UG"
          standort: "Bad Reichenhall"
          beschreibung: |
            Diese inhabergeführte Full-Service-Agentur 4 deklariert einen klaren Fokus auf KMUs im Berchtesgadener Land und im oberbayerischen Raum. Das Kernangebot umfasst Website-Erstellung und -Wartung, Social-Media-Betreuung sowie Fotografie.4 Mit über 50 bedienten Kunden und der Generierung von mehr als einer Million monatlicher Impressionen 5 ist Concorde Media ein etablierter regionaler Akteur, der das gesamte Spektrum von Branding über Campaigning bis hin zu Online- und Offline-Marketing abdeckt.5
        - name: "GS Werbung"
          standort: "Bad Reichenhall"
          beschreibung: |
            Diese Agentur repräsentiert das Fundament der hyper-lokalen Werbebedürfnisse. Der Fokus liegt klar auf "greifbarer" Werbung: Beschriftung, Schilder, Digitaldruck, Werbebanner und Glasveredelung.6 Der Kundenstamm ist implizit im lokalen Handwerk und Gewerbe zu finden, das physische Werbeträger benötigt.
        - name: "makrohaus"
          standort: "Bad Reichenhall"
          beschreibung: |
            Mit über 20 Jahren Erfahrung positioniert sich makrohaus als "mehr als eine Agentur".8 Die Analyse der "aktuellen Projekte" liefert präzise Hinweise auf den Kundenstamm: Reber Spezialitäten, Brauerei Schönram, Hotel Seeblick und Früchte Maier.8 Dies indiziert einen klaren Fokus auf die regionale Premium-Wirtschaft, insbesondere in den Sektoren Genussmittel, Tourismus und gehobener Einzelhandel.
        - name: "schoko-seite"
          standort: "Bad Reichenhall"
          beschreibung: |
            Diese Agentur demonstriert eine starke Nischen-Spezialisierung auf Sportmanagement, PR und Events.9 Das Portfolio untermauert dies mit Kunden wie dem Rennrodler Felix Loch (Sportmanagement, PR, Social Media), aber auch Transportbeton Traunstein (Design, PR, Event) und der Kunstakademie Reichenhall.9
        - name: "Viucom"
          standort: "Freilassing"
          beschreibung: |
            Positioniert sich als Anbieter für "quality-driven digital solutions" mit 25 Jahren Erfahrung.10 Ein entscheidendes Merkmal ist die Vita des Gründers, Simon Back, der bei einer der drei größten Digitalagenturen Österreichs (über 100 Mitarbeiter) tätig war.11 Viucom agiert somit als High-End-Digitaldienstleister im deutschen Hub und schlägt eine Brücke zu den anspruchsvolleren Anforderungen, die sonst eher im Salzburger Markt zu finden sind.
        - name: "atimedia"
          standort: "Region Freilassing"
          beschreibung: |
            Diese Agentur ist ein Schlüssellieferant für die Definition des hyper-lokalen Archetyps. Sie spezialisiert sich explizit auf "Internet, Website, Homepage, Webdesign für Handel, Handwerk".12 Das Portfolio ist ein Querschnitt des lokalen Gewerbes 12 und listet Dutzende KMUs wie Spenglerei Danner (spenglerfuchs.de), Schreinerei Riedhofer, Gärtnerei Stöhr, Villa Sudrow Apartments, Mais-Thai-Küche und den Berggasthof Neureuth.12
        - name: "Weitere Agenturen"
          standort: "Freilassing & Umgebung"
          beschreibung: |
            Ein dichtes Netz weiterer Spezialisten bedient den lokalen Markt, darunter HIRMKE (SEO, Grafik), I-DEA Graphics (Full Service), Joe Rankl (Social Media Berater) und Mahler Erfolg.Ist.Machbar (Full Service Digital).7

    section_1_2:
      titel: "Agenturprofile: Der österreichische Hub (Salzburg)"
      beschreibung: |
        Der Salzburger Agenturmarkt agiert auf einem signifikant anderen Niveau. Die hier ansässigen Agenturen betreuen nicht nur den regionalen Markt, sondern steuern oft nationale und internationale Etats für global agierende Konzerne.
      agenturen:
        - name: "Adwerba"
          standort: "Salzburg"
          beschreibung: |
            Gegründet 1978 13, ist Adwerba der "Global Player" in dieser regionalen Analyse. Das Kundenportfolio 13 ist von herausragender strategischer Bedeutung, da es mehrere high-level Archetypen klar definiert:
            - Global Brands: Red Bull, BMW, MINI, Miele, American Express, Nespresso.
            - B2B/Industrie: SKIDATA (ASSA ABLOY), Lenzing AG, Quehenberger Logistics, Allgemeine Bau-Chemie.
            - Top-Tourismus: Salzburger Seenland, Gut Brandlhof, Tourismus Salzburg, Aktivhotel FIRSTpeak, Schloss Leopoldskron.
            Adwerba beweist Kompetenz in komplexem Hotel-Marketing, Webentwicklung, SEO und der Produktion von High-End-Werbemitteln (z.B. Event-Kits, Mailings).13
        - name: "G.A. Service GmbH"
          standort: "Salzburg"
          beschreibung: |
            Als Full-Service-Agentur mit Standorten in Salzburg, Wien und Graz 14 bedient G.A. Service einen überregionalen Markt. Das angebotene Spektrum ist breit und umfasst Konzeption, Webprogrammierung/SEO, Online-Marketing und Video-/Film-Produktion.14 Die Projektbeschreibungen im Portfolio 14 deuten auf anspruchsvolle B2B-Kunden und den Non-Profit-Sektor hin (z.B. "Grünen Strom spielerisch entdecken", "Die neue Online-Heimat der geretteten Tiere").
        - name: "P8 Marketing"
          standort: "Salzburg"
          beschreibung: |
            Die Multi-Standort-Struktur (Innsbruck, Salzburg, Wien) 15 impliziert ebenfalls eine überregionale Kundenbasis, die über den lokalen Salzburger Markt hinausgeht.
        - name: "oha.digital (Agentur SO.UL GmbH)"
          standort: "Salzburg"
          beschreibung: |
            Diese Agentur repräsentiert den modernen, digital-fokussierten Pol in Salzburg.16 Mit den Schwerpunkten Social Media, Digital Marketing und Consulting 16 bedient sie anspruchsvolle Kunden, die spezifische, messbare digitale Lösungen benötigen. Das Portfolio 16 zeigt dies deutlich: W&M Holding (Social Recruiting), European Forum Alpbach (LinkedIn-Kampagne) und die Brauerei Die Weisse (Social Media Aktivierung).

    section_1_3:
      titel: "Synthese: Grenzübergreifende Marktdynamiken (Die 'EuRegio-Kluft')"
      beschreibung: |
        Die Analyse der EuRegio Salzburg - Berchtesgadener Land - Traunstein 17 offenbart eine signifikante strategische Kluft im Agenturmarkt, die "EuRegio-Kluft".
        - Deutscherseits (BR/F) existiert ein Markt von hyper-lokalen Dienstleistern (z.B. GS Werbung 6, atimedia 12) und soliden KMU-Betreuern (z.B. Concorde Media 4, makrohaus 8). Deren Fokus liegt auf der digitalen Grundausstattung und dem regionalen Branding.
        - Österreichseits (SZG) agiert ein Markt von Agenturen, die globale Marken (Adwerba 13) und komplexe, datengetriebene Digitalkampagnen (oha.digital 16) für internationale Kunden steuern.

        Diese Kluft hat eine zentrale strategische Implikation für das Projekt 'GRAND AGENCY': Ein Kunde in dieser EuRegio (z.B. ein Hotel in Bad Reichenhall) hat die Wahl zwischen fundamental unterschiedlichen Service-Leveln:
        - Lokaler Held: Beauftragung von atimedia 12 für eine funktionale, kosteneffiziente Website.
        - Regionaler Premium-Anbieter: Beauftragung von makrohaus 8 für ein hochwertiges Branding und regionales Storytelling.
        - Globaler Standard: Beauftragung von Adwerba 13 für eine internationale, SEO-optimierte Tourismus-Kampagne mit Anbindung an globale Buchungssysteme.

        Das 'GRAND AGENCY' Betriebssystem muss zwingend in der Lage sein, Workflows für alle drei Service-Level abzubilden. Es muss von der Erstellung einer "Visitenkarten-Website" für den lokalen Handwerker bis hin zur Steuerung einer "Global-Brand-Kampagne" skalierbar sein.

