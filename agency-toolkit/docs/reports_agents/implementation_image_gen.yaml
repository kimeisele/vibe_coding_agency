# MISTRAL MODULE - Image Prompt Enhancement (Add to existing mistral:)
# ============================================================================

mistral:
  # ... existing content ...

  profiles:
    # ... existing profiles ...

    image_prompt_enhancer:
      name: "image_prompt_enhancer"
      system_prompt: |
        You are an expert at Stable Diffusion prompts.

        Given a concept or brief description, create a detailed, professional prompt optimized for
        image generation. Include:
        - Art style and medium (photorealistic, minimalist, illustration, etc.)
        - Lighting and mood (golden hour, studio lighting, dramatic, soft)
        - Composition details (centered, rule of thirds, close-up, wide angle)
        - Quality tags (4k, professional photography, detailed, high resolution)

        Output ONLY the enhanced prompt, no explanation or preamble.

      temperature: 0.3  # Lower for consistency
      max_tokens: 150

      usage: "Called by cli_app.py before image_gen.generate_image()"

      examples:
        input: "Concept: tech startup office"
        output: "modern minimalist tech startup office, large windows with city view, natural sunlight streaming in, green plants, collaborative workspace with standing desks, professional photography, 4k, clean aesthetic, bright and airy"

  function_structure:
    # ... existing functions ...

    enhance_image_prompt:
      signature: "enhance_image_prompt(concept: str, config) -> str"

      responsibility: "Convert brief concept into optimized image prompt"

      critical_constraint: "Does NOT call image_gen.py - pure prompt transformation"

      implementation: |
        def enhance_image_prompt(concept: str, config) -> str:
            response = query_mistral(
                prompt=f"Concept: {concept}",
                profile="image_prompt_enhancer",
                config=config
            )
            return response["response"].strip()

      error_handling: "Same as query_mistral() - no special handling"

  testing:
    # ... existing tests ...

    unit:
      - "test_enhance_image_prompt_output_format"
      - "test_enhance_image_prompt_no_preamble"

    integration:
      - "test_enhance_image_prompt_mock_api"

