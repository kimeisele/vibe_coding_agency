# ============================================================================
# CLI ORCHESTRATION (Add to existing cli: section in BLUEPRINT.yaml)
# ============================================================================

cli:
  # ... existing content ...

  orchestration_patterns:
    social_with_ai_background:
      command: "toolkit social 'text' --bg-concept 'concept'"

      flow:
        step_1: "cli_app.py receives --bg-concept"
        step_2: "If registry: prefix → load from registry, else continue"
        step_3: "cli_app.py calls mistral.enhance_image_prompt(concept)"
        step_4: "cli_app.py calls image_gen.generate_image(enhanced_prompt)"
        step_5: "cli_app.py calls social.generate_social_post(text, background_image_path=...)"
        step_6: "cli_app.py displays cost + paths"

      implementation: |
        @app.command()
        def social_cmd(..., bg_concept: Optional[str] = None, bg_seed: Optional[int] = None):
            config = ctx.obj
            background_image_path = None
            total_cost = 0.0

            if bg_concept:
                # Step 2: Registry check
                if bg_concept.startswith("registry:"):
                    concept_id = bg_concept.replace("registry:", "")
                    actual_prompt = _load_from_registry("image-concepts", concept_id)
                else:
                    # Step 3: Mistral enhancement
                    actual_prompt = mistral.enhance_image_prompt(bg_concept, config)

                # Step 4: Image generation
                img_result = image_gen.generate_image(
                    prompt=actual_prompt,
                    seed=bg_seed,
                    config=config
                )
                background_image_path = Path(img_result["path"])
                total_cost = img_result["cost"]

            # Step 5: Social post generation
            result = social.generate_social_post(
                text=text,
                ...,
                background_image_path=background_image_path,
                config=config
            )

            # Step 6: Display
            typer.secho(f"✅ Social post: {result['path']}", fg="green")
            if total_cost > 0:
                typer.secho(f"💰 Cost: ${total_cost:.4f}", fg="cyan")

  error_display:
    api_errors:
      pattern: "Catch exceptions from modules, display user-friendly"
      example: |
        try:
            result = image_gen.generate_image(...)
        except ValueError as e:
            # Missing token, invalid params
            typer.secho(f"❌ Configuration error: {e}", fg="red")
            raise typer.Exit(1)
        except RuntimeError as e:
            # API errors, timeouts
            typer.secho(f"❌ API error: {e}", fg="red")
            raise typer.Exit(1)

# ============================================================================
# REGISTRY STRUCTURE (Add to existing registry: section)
# ============================================================================

registry:
  # ... existing content ...

  image_concepts:
    file: "registry/prompts/image-concepts.json"

    structure:
      metadata:
        id: "image-concepts"
        name: "AI Image Concepts Library"
        description: "Pre-optimized prompts for image generation"
        version: "1.0"
        type: "prompts"

      entries:
        format: "{ 'concept-id': { 'name', 'prompt', 'tags' } }"

        example: |
          "tech-startup": {
            "name": "Tech Startup Office",
            "prompt": "modern minimalist tech startup office, large windows...",
            "tags": ["tech", "office", "professional"]
          }

    usage:
      cli: "toolkit social 'text' --bg-concept registry:tech-startup"

      loading_logic: |
        def _load_from_registry(registry_type: str, entry_id: str) -> str:
            path = Path(f"registry/prompts/{registry_type}.json")
            data = json.loads(path.read_text())
            return data["entries"][entry_id]["prompt"]

    initial_entries:
      - "tech-startup"
      - "abstract-gradient"
      - "celebration"
      - "nature-calm"
      - "product-minimal"

    extensibility:
      user_override: "~/.config/agency-toolkit/registry/prompts/image-concepts.json"
      merge_strategy: "User entries override built-in if same ID"

# ============================================================================
# COST TRACKING (Add new section or append to quality:)
# ============================================================================

cost_tracking:
  philosophy: "Transparent, user-controlled, no surprises"

  phase_1_mvp:
    scope: "Per-request cost estimation + display"

    implementation:
      return_value: "All generate_image() calls return {'cost': float}"
      display: "cli_app.py shows cost after each generation"
      config: "[image_generation] enable_cost_tracking = true"

    no_persistence: "MVP does not store costs (Phase 4 feature)"

  phase_4_future:
    scope: "Daily/monthly tracking, budget alerts"

    features:
      - "Store costs in ~/.config/agency-toolkit/costs.json"
      - "toolkit costs today/week/month"
      - "Hard budget limits (block if exceeded)"
      - "Cost analytics dashboard"

