    - "agency_toolkit/core/structure/template_loader.py (template handling)"
    - "agency_toolkit/core/structure/folder_builder.py (folder creation)"
    - "agency_toolkit/core/structure/validators.py (validation)"

  responsibility: "Create standardized project folder structures"

  function_structure:
    # Location: agency_toolkit/core/structure/generator.py
    public:
      - "create_structure(client, project, type, base_path, config) -> dict"

    # Location: agency_toolkit/core/structure/template_loader.py
    template_module:
      - "load_template(type: str) -> list[str]"
      - "get_available_templates() -> list[str]"

    # Location: agency_toolkit/core/structure/folder_builder.py
    builder_module:
      - "sanitize_name(name: str) -> str"
      - "create_folders(root: Path, folders: list[str]) -> None"
      - "create_readme(root: Path, metadata: dict) -> None"

  template_definition:
    location: "templates/folders/"
    rationale: "JSON files define the folder tree"
    structure: |
      {
        "rationale": "Brief explanation of structure purpose",
        "tree": [
          "src/components",
          "src/pages",
          "docs"
        ]
      }

  validation:
    sanitization:
      method: "python-slugify"
      example: "'Client XY & Co!' -> 'client-xy-co'"

    path_check:
      action: "Error if exists (no --force in v1)"
      message: "Path {path} already exists. Delete manually or choose different name."

  error_handling:
    template_not_found:
      action: "Fallback to default.json + log warning"
      message: "Template '{type}' not found, using 'default'"

    permission_error:
      action: "Raise OSError with clear message"
      message: "Cannot create folders in {path}. Check permissions."

  template_reference:
    location: "templates/folders/"
    available:
      - "default.json: Simple generic structure (src, docs, data, tests)"
      - "web.json: Modern frontend project (components, pages, styles)"
      - "video.json: Video editing structure (source, footage, renders)"

  testing:
    unit:
      - "test_sanitize_special_chars"
      - "test_load_template"
      - "test_path_collision"

    integration:
      - "test_create_web_structure"
      - "test_readme_generation"
      - "test_custom_base_path"

# ============================================================================
# MODULE 4: AI & PROVIDERS (Refactored - Modular Structure)
# ============================================================================

ai_and_providers:
  command: "ai"
  aliases: ["mistral"]
  files:
    - "agency_toolkit/providers/ (all provider logic)"
    - "agency_toolkit/tasks/ai_handler.py (handler for orchestrator)"
    - "agency_toolkit/commands/ai.py (direct CLI command)"

  responsibility: "Terminal-based AI interface with profiles, using the TextProvider plugin system."
  orchestrator_role: "The `AITaskHandler` is the orchestrator's entry point for any AI task. It dynamically loads the correct TextProvider (Mistral, Google, Ollama) and executes the text generation."

  risk_assessment:
    severity: "HIGH (external API, user-facing)"
    failure_modes:
      - "Missing API_KEY for a given provider"
      - "Network timeouts"
      - "API rate limits"
      - "500-series server errors"
      - "Invalid model name"
      - "Invalid profile name"

  function_structure:
    # Location: agency_toolkit/providers/base.py
    public:
      - "TextProvider.generate(prompt, model, temperature, max_tokens, system_prompt) -> dict"

    # Location: agency_toolkit/commands/ai.py
    profile_module:
      - "load_profile(profile_name: str, config) -> dict"
      - "get_available_profiles() -> list[str]"
      - "merge_profile_config(profile: dict, config: dict) -> dict"

  input_handling:
    modes:
      prompt_flag: "--prompt 'Your query'"
      prompt_file: "--prompt-file query.txt"
      stdin: "cat file.txt | toolkit ai"

    priority: "stdin > --prompt-file > --prompt"
    validation: "Prompt must be non-empty string"

  error_handling_protocol:
    missing_api_key:
      check: "os.getenv('{PROVIDER}_API_KEY')"
      action: "Raise typer.Exit(1)"
      message: |
        {PROVIDER}_API_KEY not found.
        Set it with: export {PROVIDER}_API_KEY='your-key-here'

    connection_timeout:
      exception: "httpx.TimeoutException"
      action: "Log + retry once + fail"
      message: "API timeout. Check your internet connection."

    rate_limit:
      exception: "Provider-specific RateLimitError"
      action: "Log + fail (no retry)"
      message: "Rate limit exceeded. Wait {retry_after} seconds or upgrade your plan."

    server_error:
      exception: "Provider-specific APIError (status >= 500)"
      action: "Log full error + fail"
      message: "API error: {error}. Try again later."

    invalid_model:
      exception: "Provider-specific InvalidRequestError"
      action: "List valid models + fail"
      message: "Invalid model '{model}'. Valid: {valid_models}"

    invalid_profile:
      check: "If profile name not in config keys"
      action: "Raise typer.Exit(1)"
      message: "Profile '{profile}' not found in config.toml"

  testing:
    unit:
      - "test_get_api_key_missing"
      - "test_load_prompt_from_file"
      - "test_load_prompt_from_stdin"

    integration:
      - "test_ai_query_success (mock API)"
      - "test_ai_timeout (mock timeout)"
      - "test_ai_rate_limit (mock error)"
      - "test_ai_profile_loading"

    mocking:
      library: "pytest-mock or unittest.mock"
      mock_target: "provider's generate method"

# ============================================================================
# MODULE 5: GRAND AGENCY OS (Orchestration & Task Handler System)
# ============================================================================

grand_agency_os:
  command: "os"
  purpose: "Orchestrated project workflows via registry-based solution modules"
  files:
    - "agency_toolkit/commands/os.py (CLI interface for OS workflows)"
    - "agency_toolkit/core/orchestrator.py (Task execution engine)"
    - "agency_toolkit/core/workflow_loader.py (Loads definitions from registry)"
    - "agency_toolkit/tasks/ (Directory for all task handlers)"
    - "registry/seeds/solutions.json (Workflow definitions)"

  architecture:
    pattern: "Workflow Engine with Strategy Pattern for tasks"
    description: "The 'os' command initiates a workflow. The orchestrator reads a workflow definition from solutions.json, which contains a list of tasks. For each task, the orchestrator uses the Task Registry to find the correct Task Handler based on the task's 'tool' name. It then executes that handler, passing it the required parameters and context. This decouples the orchestration logic from the actual task implementation."

    components:
      workflow_loader:
        file: "agency_toolkit/core/workflow_loader.py"
        responsibility: "Loads and validates `archetypes.json` and `solutions.json` from the `registry/seeds/` directory."
      orchestrator:
        file: "agency_toolkit/core/orchestrator.py"
        responsibility: "The core execution engine. It iterates through tasks, manages the `step_context` for passing data between tasks, resolves `{placeholder}` variables, and calls the appropriate task handler."
      task_handler_base:
        file: "agency_toolkit/tasks/base.py"
        responsibility: "Defines the `TaskHandler` abstract base class (interface) and the `TaskContext` data class. Every task handler must implement this interface."
      task_registry:
        file: "agency_toolkit/tasks/registry.py"
        responsibility: "Maintains a global registry of all available task handlers. The orchestrator uses `get_task_handler(name)` to dynamically dispatch tasks."
      task_handlers:
        directory: "agency_toolkit/tasks/"
        responsibility: "Contains concrete implementations of `TaskHandler` for each tool type (e.g., `ai`, `social`, `briefing`). Each handler contains the logic for one specific type of task."

  workflow_execution_flow:
    step_1: "User runs `toolkit os init`."
    step_2: "`commands/os.py` handles interactive selection of archetype and solution."
    step_3: "`core/workflow_loader.py` loads the selected solution from `solutions.json`."
    step_4: "`commands/os.py` calls `core/orchestrator.py:execute_module` with the list of tasks."
    step_5: "Orchestrator loops through each task in the module."
    step_6: "For a task (e.g., `tool: 'ai'`), it calls `tasks/registry.py:get_task_handler('ai')`."
    step_7: "It receives an instance of `AITaskHandler`."
    step_8: "It calls `handler.execute(params, context)`."
    step_9: "The handler performs the actual work (e.g., calls an AI provider)."
    step_10: "The result is stored in `step_context` if `output_key` is defined, ready for the next task."

  task_handler_implementations:
    AITaskHandler:
      file: "tasks/ai_handler.py"
      tool_name: "ai"
      responsibility: "Generates text using a configured AI provider. Acts as an adapter to the `providers` module."
    SocialTaskHandler:
      file: "tasks/social_handler.py"
      tool_name: "social"
      responsibility: "Generates a social media post by calling the `core/social/generator.py` module."
    BriefingTaskHandler:
      file: "tasks/briefing_handler.py"
      tool_name: "briefing"
      responsibility: "Generates a briefing document by calling the `core/briefing/generator.py` module."
    StructureTaskHandler:
      file: "tasks/structure_handler.py"
      tool_name: "structure"
      responsibility: "Creates a folder structure by calling the `core/structure/generator.py` module."

  context_and_data_passing:
    TaskContext:
      description: "A dataclass (`tasks/base.py`) passed to every `execute` method. It contains the global config, project metadata, and the `step_context`."
    step_context:
      description: "A dictionary within `TaskContext` that holds the outputs of previous tasks. This is the primary mechanism for inter-task communication."
    output_key:
      description: "A parameter in a task definition in `solutions.json`. If a task has `\"output_key\": \"my_var\"`, its return value is stored in `step_context['my_var']`."
    placeholder_resolution:
      description: "The orchestrator uses `format_task_params` to replace placeholders like `{my_var}` in a task's parameters with values from the `step_context` before execution."
      example: "An 'ai' task saves its output to `recruiting_slogan`. A subsequent 'social' task can have `\"text\": \"{recruiting_slogan}\"` to use that output."

# ============================================================================
# PLUGIN ARCHITECTURE: IMAGE PROVIDERS (Epic 2 Implementation)
# ============================================================================

providers:
  responsibility: "Flexible, multi-provider image generation with plugin system"

  architecture:
    pattern: "Abstract Base Class + Registry + Concrete Implementations"
    location: "agency_toolkit/providers/"

    components:
      base:
        file: "agency_toolkit/providers/base.py"
        description: "Abstract base class defining provider interfaces"
        exports:
          - "class ImageProvider(ABC)"
          - "class TextProvider(ABC) - NEW in Epic 11"
          - "class ImageProviderError(Exception)"

      registry:
        file: "agency_toolkit/providers/provider_loader.py"
        description: "Provider discovery and factory pattern (image + text)"
        exports:
          - "class ProviderRegistry"
          - "get_provider(name: str) -> ImageProvider"
          - "list_providers() -> dict[str, Type[ImageProvider]]"
          - "get_text_provider(name: str) -> TextProvider - NEW in Epic 11"
          - "list_text_providers() -> list[str] - NEW in Epic 11"

      replicate:
        file: "agency_toolkit/providers/replicate.py"
        description: "Replicate provider (paid, optional)"
        exports:
          - "class ReplicateProvider(ImageProvider)"
        requirements:
          - "Requires: REPLICATE_API_TOKEN environment variable"
          - "Models: stability-ai/sdxl, flux-schnell, etc."
          - "Cost: $0.0023-0.0055 per image"

      pollinations:
        file: "agency_toolkit/providers/pollinations.py"
        description: "Pollinations.ai provider (FREE - default)"
        exports:
          - "class PollinationsProvider(ImageProvider)"
        features:
          - "No API token required"
          - "Free tier available"
          - "Default provider for all image generation"
          - "Models: Flux, SDXL"

      mistral_provider:
        file: "agency_toolkit/providers/mistral_provider.py"
        description: "Mistral AI text generation provider (Epic 11)"
        exports:
          - "class MistralProvider(TextProvider)"
        requirements:
          - "Requires: MISTRAL_API_KEY environment variable"
          - "Models: mistral-tiny, mistral-small-latest, mistral-medium, mistral-large-latest"
          - "Cost: ~$0.001/1K input, $0.003/1K output tokens"
        features:
          - "Cloud-based, high quality"
          - "Rate limiting and retry logic"
          - "Profile support (code, creative, debug, agency_comms)"

      ollama_provider:
        file: "agency_toolkit/providers/ollama_provider.py"
        description: "Ollama local text generation provider (FREE - Epic 11)"
        exports:
          - "class OllamaProvider(TextProvider)"
        requirements:
          - "Requires: Ollama installed locally (ollama.ai)"
          - "Models: llama3.2, llama3.1, mistral, codellama, phi3"
          - "Cost: FREE (runs locally)"
        features:
          - "Zero cost, privacy-focused"
          - "No API tokens required"
          - "Runs on local hardware"

      google_provider:
        file: "agency_toolkit/providers/google_provider.py"
        description: "Google GenAI text generation provider (Epic 12)"
        exports:
          - "class GoogleProvider(TextProvider)"
        requirements:
          - "Requires: GOOGLE_API_KEY environment variable"
          - "Models: gemini-pro, gemini-1.5-pro, gemini-1.5-flash"
          - "Cost: Free tier available, then ~$0.00025/1K input tokens"
        features:
          - "Cloud-based, fast and efficient"
          - "Generous free tier (2M tokens/min)"
          - "Error handling for quota, timeout, server errors"
        status: "✅ VALIDATED (Epic 14 testing)"

  interface:
    abstract_methods:
      - "async generate(prompt: str, seed: int, width: int, height: int) -> dict"
      - "get_cost() -> float"
      - "validate_api_credentials() -> bool"
      - "get_supported_models() -> list[str]"

  configuration:
    config_section: "[image_generation]"
    settings:
      - "provider: str = 'pollinations' (default)"
      - "model: str = 'flux' (provider-specific)"
      - "width: int = 1024"
      - "height: int = 1024"
      - "enable_cost_tracking: bool = true"
      - "daily_budget: float = 50.0"

  testing:
    unit:
      - "test_base_provider_abstract_methods"
      - "test_registry_loading_all_providers"
      - "test_replicate_api_error_handling"
      - "test_pollinations_free_generation"
      - "test_provider_cost_calculation"

    integration:
      - "test_switch_providers_mid_workflow"
      - "test_pollinations_vs_replicate_same_prompt"
      - "test_provider_fallback_on_api_error"

