# ============================================================================
# IMPLEMENTATION.yaml - Image Generation Section (Append after mistral:)
# ============================================================================

image_generation:
  command: "image"
  file: "agency_toolkit/image_gen.py"

  responsibility: "Generate AI images via providers (NO orchestration)"

  critical_constraints:
    no_imports: "NEVER import mistral.py or social.py"
    no_orchestration: "Does NOT chain other modules"
    pure_function: "Input: prompt → Output: image path + metadata"

  function_structure:
    public:
      - "generate_image(prompt, seed, width, height, provider, model, output_path, config) -> dict"

    private:
      - "_generate_replicate(prompt, seed, ...) -> dict"
      - "_generate_stability(prompt, seed, ...) -> dict (Phase 4)"
      - "_generate_dalle(prompt, seed, ...) -> dict (Phase 4)"
      - "_generate_seed(content: str) -> int"
      - "_download_image(url: str, path: Path) -> Path"
      - "_get_api_token(provider: ImageProvider) -> str"

  return_value:
    type: "dict"
    required_keys:
      - "path: str (absolute path to saved image)"
      - "cost: float (estimated USD)"
      - "seed: int (used seed)"
      - "model: str (model identifier)"
    optional_keys:
      - "url: str (original URL if applicable)"

  validation_model:
    location: "models.py"
    class: "ImageGenerationConfig"
    fields:
      provider: ImageProvider
      model: str
      default_width: int
      default_height: int
      seed_strategy: str  # "hash_content" | "fixed" | "random"
      default_seed: int | None
      enable_cost_tracking: bool
      daily_budget: float

  error_handling:
    missing_token:
      check: "os.getenv('{PROVIDER}_API_TOKEN')"
      action: "Raise ValueError (NOT typer.Exit - not in CLI context)"
      message: |
        {PROVIDER}_API_TOKEN not set.

        Setup instructions:
        1. Get token: {PROVIDER_URL}
        2. Export: export {PROVIDER}_API_TOKEN='...'

      example: |
        REPLICATE_API_TOKEN not set.

        Get your free token: https://replicate.com/account/api-tokens
        Set it: export REPLICATE_API_TOKEN='r8_...'

    api_timeout:
      exception: "httpx.TimeoutException or requests.Timeout"
      action: "Raise RuntimeError (cli_app.py handles display)"
      message: "{provider} API timeout. Check internet connection."

    rate_limit:
      exception: "Provider-specific rate limit error"
      action: "Raise RuntimeError"
      message: "Rate limit exceeded. Wait {retry_after}s or upgrade plan."

    server_error:
      exception: "HTTP 5xx"
      action: "Raise RuntimeError"
      message: "{provider} server error: {error}. Try again later."

    invalid_model:
      check: "Model name validation"
      action: "Raise ValueError"
      message: "Invalid model '{model}' for provider '{provider}'. Valid: {valid_models}"

  provider_implementations:
    pollinations:
      phase: "Phase 1 (MVP - CURRENT DEFAULT)"
      package: "Built-in (no additional dependencies)"
      env_var: "None (completely FREE)"

      supported_models:
        - "flux (default, fast, FREE)"
        - "flux-pro (higher quality)"
        - "sdxl (stable, FREE)"

      api_call_pattern: |
        import requests
        response = requests.get(
            "https://image.pollinations.ai/prompt/...",
            params={"prompt": prompt, "seed": seed, "width": width, "height": height, "model": model}
        )
        image_data = response.content

      cost_estimation:
        all_models: 0.0  # USD per image (COMPLETELY FREE)

      determinism: "✅ Full support via seed parameter"

      notes:
        - "Default provider changed from Replicate → Pollinations (Epic 2.4)"
        - "Removes barrier to entry (no API token needed)"
        - "Provides unlimited free tier"

    replicate:
      phase: "Phase 1 (MVP - OPTIONAL)"
      package: "replicate (pip install replicate)"
      env_var: "REPLICATE_API_TOKEN (optional)"
      status: "Maintained for power users, not default"

      supported_models:
        - "stability-ai/sdxl"
        - "stability-ai/stable-diffusion"
        - "black-forest-labs/flux-schnell"

      api_call_pattern: |
        import replicate
        client = replicate.Client(api_token=token)
        output = client.run(
            model,
            input={"prompt": prompt, "seed": seed, "width": width, "height": height}
        )

      cost_estimation:
        sdxl: 0.0032  # USD per image
        sd_15: 0.0023
        flux: 0.0055

      determinism: "✅ Full support via seed parameter"

    stability:
      phase: "Phase 4 (Future)"
      package: "stability-sdk"
      env_var: "STABILITY_API_KEY"
      note: "Implementation deferred - extensible via provider plugin system"

    dalle:
      phase: "Phase 4 (Future)"
      package: "openai"
      env_var: "OPENAI_API_KEY"
      note: "Implementation deferred - seed support limited"

  seed_generation:
    strategy: "hash_content (default from config)"

    implementations:
      hash_content:
        logic: "hash(prompt) % (2^32)"
        code: |
          import hashlib
          hash_digest = hashlib.sha256(prompt.encode()).hexdigest()
          return int(hash_digest[:8], 16)

        rationale: "Same prompt → same seed → same image (deterministic)"

      fixed:
        logic: "config.default_seed"
        rationale: "All images identical (for testing)"

      random:
        logic: "None (provider generates random)"
        rationale: "Maximum variety (not deterministic)"

  testing:
    unit:
      - "test_generate_seed_consistent"
      - "test_generate_seed_different_prompts"
      - "test_missing_replicate_token"
      - "test_provider_enum_validation"
      - "test_cost_in_return_value"

    integration:
      - "test_generate_image_replicate_mock"
      - "test_download_image_mock"
      - "test_api_error_handling"

    mocking:
      library: "pytest-mock or unittest.mock"
      mock_targets:
        - "replicate.Client.run"
        - "requests.get (for image download)"

