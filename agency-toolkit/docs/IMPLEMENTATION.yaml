  architecture:
    registry_layer:
      archetypes: "Define client personas (e.g., 'Local Craftsman', 'B2B SaaS')"
      solutions: "Define workflow templates linked to archetypes"
      modules: "Define task sequences within solutions (with optional dependencies)"
      tasks: "Individual tool invocations with parameters (supports dynamic prompts)"

    dependency_layer:
      location: "core/dependency_resolver.py"
      components:
        resolve_module_dependencies: "Main entry point - resolves dependency tree"
        _resolve_recursive: "Recursive DFS for dependency traversal"
        _validate_no_circular: "Circular dependency detection"

      features:
        - "Automatic resolution of module dependencies from solutions.json"
        - "Topological ordering for correct execution sequence"
        - "Circular dependency detection with clear error messages"
        - "Support for complex dependency graphs (linear, tree, diamond)"

      dependency_format:
        description: "Modules declare dependencies via 'dependencies' array in solutions.json"
        example: |
          {
            "id": "module-c",
            "title": "Advanced Module",
            "dependencies": ["module-a", "module-b"]
          }

    orchestration_layer:
      location: "core/orchestrator.py"
      components:
        execute_module: "Main entry point - loops through tasks, handles errors"
        _execute_task: "Tool dispatcher - maps tool names to core functions"
        _format_task_params: "Dynamic prompt templating with context substitution"

      tool_mapping:
        structure: "Calls core/structure/generator.py::generate()"
        briefing: "Calls briefing.py::generate_briefing()"
        social: "Calls core/social/generator.py::generate()"

      dynamic_prompts:
        description: "Task params support {placeholder} syntax for context injection"
        supported_placeholders:
          - "{project_name}: User-provided project name"
          - "{archetype_name}: Selected archetype display name"
          - "{solution_name}: Selected solution display name"
          - "{pain_points}: Archetype pain points (comma-separated)"
          - "{goals}: Archetype goals (comma-separated)"

        example: |
          params: {
            "text": "Create a post for {archetype_name} about {project_name}"
          }
          → becomes: "Create a post for Local Craftsman about My Bakery"

      error_handling:
        - "Per-task try/catch with TaskResult tracking"
        - "stop_on_error flag for fail-fast behavior"
        - "Detailed error logging with exc_info=True"
        - "Dependency chain stops if upstream module fails"

    cli_layer:
      location: "commands/os.py"
      command: "os init --name 'Project Name'"
      workflow:
        - "Step 1: Validate registry (archetypes + solutions)"
        - "Step 2: Interactive archetype selection"
        - "Step 3: Interactive solution selection (filtered by archetype)"
        - "Step 4: Interactive module selection"
        - "Step 5: Resolve module dependencies (if any)"
        - "Step 6: Build execution context"
        - "Step 7: Execute all modules in dependency order"

  context_variables:
    description: "Data passed from CLI through orchestrator to core functions"
    structure:
      project_name: "User-provided project name"
      archetype_id: "Selected archetype ID (e.g., 'I', 'II')"
      archetype_name: "Selected archetype display name"
      solution_id: "Selected solution ID (e.g., 'A1', 'B2')"
      solution_name: "Selected solution display name"
      pain_points: "List of archetype pain points"
      goals: "List of archetype goals"
      stop_on_error: "Boolean - whether to halt on first error"

  task_execution:
    structure_task:
      tool: "structure"
      params:
        structure_type: "Type of project (web, print, video, social)"
        base_path: "Base output directory (default: ./output)"
        dry_run: "Boolean - preview without creating"
        force: "Boolean - overwrite existing structure"

      context_mapping:
        client: "context['archetype_name']"
        project: "context['project_name']"

    briefing_task:
      tool: "briefing"
      params:
        format_type: "Output format (pdf, md)"
        output_dir: "Output directory (default: ./output/briefings)"
        target_audience: "Target audience description"
        deliverables: "List of deliverables"
        deadline: "Project deadline (YYYY-MM-DD)"
        budget: "Project budget"
        notes: "Additional notes"

      context_mapping:
        client_name: "context['archetype_name']"
        project_name: "context['project_name']"
        project_type: "context['solution_name']"
        objectives: "context['goals']"

    social_task:
      tool: "social"
      params:
        text: "Post text content"
        style: "Template style (modern, minimal, bold)"
        color: "Color name or 'custom'"
        format: "Image format (square, story, landscape)"
        output_dir: "Output directory (default: ./output/social)"
        dry_run: "Boolean - preview without creating"

  validation:
    registry_validation:
      location: "core/grand_agency_registry.py::validate_registry()"
      checks:
        - "archetypes.json exists and is valid JSON"
        - "solutions.json exists and is valid JSON"
        - "All solutions reference valid archetype_ids"
        - "All modules have required fields (id, title, description)"

      error_handling:
        - "Raises ValueError with descriptive message"
        - "Fails fast during 'os init' command"

  testing:
    unit:
      registry_tests:
        location: "tests/unit/test_grand_agency_registry.py"
        tests:
          - "test_load_archetypes_success"
          - "test_load_solutions_success"
          - "test_validate_registry_success"
          - "test_registry_missing_file"
          - "test_registry_invalid_json"

      dependency_tests:
        location: "tests/unit/test_dependency_resolver.py"
        tests:
          - "test_single_module_no_dependencies"
          - "test_linear_dependency_chain"
          - "test_multiple_dependencies"
          - "test_circular_dependency_detection"
          - "test_self_circular_dependency"
          - "test_missing_dependency"
          - "test_realistic_agency_workflow"

    integration:
      location: "tests/integration/test_grand_agency_integration.py"
      tests:
        - "test_os_init_workflow (CLI + orchestrator + core functions)"
        - "test_execute_module_real_structure_task (creates actual folders)"
        - "test_execute_module_real_briefing_task (creates actual PDF)"
        - "test_execute_module_real_social_task (creates actual image)"
        - "test_execute_module_error_handling"
        - "test_dependency_resolution_executes_in_order"

      validation:
        - "Verify actual output files are created (not placeholders)"
        - "Verify TaskResult success/failure tracking"
        - "Verify stop_on_error behavior"
        - "Verify dependency chain execution order"
        - "Verify dynamic prompt substitution"

  phase_status:
    phase_1_complete: true
    phase_1_scope:
      - "✅ CLI workflow (os init command)"
      - "✅ Registry loading and validation"
      - "✅ Interactive selection prompts"
      - "✅ Orchestrator with real core function integration"
      - "✅ Error handling and result tracking"

    phase_2_complete: true
    phase_2_scope:
      - "✅ Dependency resolution (dependency_resolver.py)"
      - "✅ Automatic module ordering via topological sort"
      - "✅ Circular dependency detection"
      - "✅ Dynamic prompt templating with context injection"
      - "✅ Multi-module execution chain support"
      - "✅ Full integration and unit test coverage"

    phase_3_complete: true
    phase_3_scope_epic_13:
      description: "AI Task Integration (Epic 13 / WU 14.1-14.2)"
      achievements:
        - "✅ AI tool in orchestrator (_execute_task handles 'ai' tool)"
        - "✅ Inter-task context passing (step_context dictionary)"
        - "✅ Output key mechanism (tasks can declare output_key)"
        - "✅ Placeholder resolution in params ({variable} syntax)"
        - "✅ Provider-agnostic AI generation (uses get_text_provider)"
      implementation_details:
        ai_tool_execution: |
          When tool_name == "ai":
          1. Extract prompt, provider, model, temperature from params
          2. Get TextProvider via get_text_provider(provider_name)
          3. Call provider.generate(prompt, model, temperature, max_tokens)
          4. Return response text (not full result dict)
        inter_task_context: |
          - execute_module maintains step_context = {}
          - If task has "output_key": "my_var", result stored in step_context['my_var']
          - _format_task_params resolves {my_var} placeholders from context
          - Allows chaining: AI generates text → Social uses {generated_text}

    phase_4_complete: true
    phase_4_scope_epic_14:
      description: "Production AI Workflows (Epic 14 / WU 14.3-14.4)"
      achievements:
        - "✅ 4 real-world AI modules in solutions.json"
        - "✅ A1_M4: Social Recruiting (AI → Social pipeline)"
        - "✅ A2_M4: Tourism Social Media (AI → Social pipeline)"
        - "✅ B1_M3: B2B Lead Content (AI → Briefing pipeline)"
        - "✅ C1_M3: Local Retail Campaign (AI → Social pipeline)"
        - "✅ Comprehensive batch test (4/4 scenarios, 21/21 tasks)"
        - "✅ Mistral API integration validated"
        - "✅ Google API integration validated"
        - "⏳ WU 14.4: Manual quality review (IN PROGRESS)"
      test_results:
        date: "2025-11-07"
        scenarios_passed: "4/4"
        tasks_executed: "21/21"
        artifacts_generated:
          social_images: 3
          briefing_pdfs: 6
        api_providers_tested:
          - "Mistral (working)"
          - "Google (working)"
      known_issues:
        artifact_quality:
          description: "Generated artifacts exist but quality needs review"
          symptoms:
            - "PDF files are small (~4KB) - may be missing content"
            - "AI-generated text may contain 'AI slop'"
            - "Text length warnings (1686 chars vs 280 max for social)"
          next_steps:
            - "WU 14.4: Manual inspection of PNGs and PDFs"
            - "WU 14.5: Refine AI prompts for better output quality"
            - "Fix text length constraints in social tool"

    future_phases:
      phase_5_quality_refinement:
        description: "AI Output Quality Improvement (WU 14.5+)"
        scope:
          - "Prompt engineering for concise, high-quality output"
          - "Content validation (length, tone, formatting)"
          - "Anti-AI-slop detection and filtering"
          - "User feedback integration for prompt refinement"

