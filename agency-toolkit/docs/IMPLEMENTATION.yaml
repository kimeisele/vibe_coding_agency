# ============================================================================
# ARCHITECTURE OVERVIEW: CORE/ + PROVIDERS/ + TASKS/ STRUCTURE
# ============================================================================
#
# After Epics 1-14, the codebase has been refactored into:
#
#   agency_toolkit/
#   ├── core/                    # Modular business logic (e.g., image rendering)
#   ├── providers/               # Plugin architecture for external APIs (Text & Image)
#   ├── commands/                # CLI handlers (user-facing Typer commands)
#   ├── tasks/                   # Orchestrator task handlers (the "verbs" of the OS)
#   ├── models.py                # Pydantic models (validation)
#   └── ... (other utility modules)
#
# Philosophy:
#   - The `os` command uses an orchestrator that calls `Task Handlers` in the `tasks/` dir.
#   - Task Handlers are adapters that call the pure logic in `core/`.
#   - Standalone commands (`social`, `briefing`) can also call `core/` logic directly.
#
# ============================================================================

# ============================================================================
# MODULE 1: SOCIAL MEDIA (Refactored - Modular Structure)
# ============================================================================

social:
  command: "social"
  files:
    - "agency_toolkit/social.py (backward-compat wrapper)"
    - "agency_toolkit/core/social/generator.py (main logic)"
    - "agency_toolkit/core/social/layout.py (layout calculations)"
    - "agency_toolkit/core/social/rendering.py (PIL rendering)"
    - "agency_toolkit/core/social/validators.py (validation)"
    - "agency_toolkit/commands/social.py (CLI command with batch support - v1.1)"

  responsibility: "Generate branded social media posts (single or batch)"

  epic_9_enhancements:
    batch_processing:
      description: "Generate multiple posts from CSV or JSON files"
      cli_flags:
        - "--from-csv FILE_PATH: Process CSV file"
        - "--from-json FILE_PATH: Process JSON file"
      validation:
        - "Mutually exclusive with --text argument"
        - "Cannot use both --from-csv and --from-json"
        - "CSV must have 'text' column (case-insensitive)"
        - "JSON must be array of objects"
      csv_format:
        required_headers: ["text"]
        optional_headers: ["style", "color", "format", "bg_concept"]
      json_format:
        structure: "Array of objects with 'text' (required) + optional keys"
      error_handling:
        - "Skip rows with empty text, log warning"
        - "Continue processing on individual failures"
        - "Report summary: 'Generated X/Y posts. N failed.'"
      implementation:
        - "_process_batch_csv() helper in commands/social.py"
        - "_process_batch_json() helper in commands/social.py"
        - "_process_single_post() extracted for reuse"
        - "Filename collision fix: Use microsecond timestamps in generator.py"

  input_handling:
    modes:
      argument: "toolkit social generate 'Your query'"
      stdin: "cat file.txt | toolkit social generate -"
      batch_csv: "toolkit social generate --from-csv campaign.csv"
      batch_json: "toolkit social generate --from-json posts.json"

    priority: "batch > stdin > argument"
    validation: "Text must be non-empty string"

  function_structure:
    # Location: agency_toolkit/core/social/generator.py
    public:
      - "generate_social_post(text, style, color, format, background_image_path=None, config) -> dict"

    # Location: agency_toolkit/core/social/layout.py
    layout_module:
      - "calculate_text_position(format, template) -> tuple[int, int]"
      - "calculate_font_size(template, available_space) -> int"
      - "wrap_text(text, font, max_width) -> list[str]"

    # Location: agency_toolkit/core/social/rendering.py
    rendering_module:
      - "load_template(style: str) -> SocialTemplate"
      - "create_base_image(format: str, color: str, template) -> PIL.Image"
      - "load_background_image(path: Path, format: str) -> PIL.Image"
      - "render_text(image, text, template) -> PIL.Image"
      - "save_image(image, output_dir) -> Path"

    # Location: agency_toolkit/core/social/validators.py
    validation_module:
      - "validate_style(style: str) -> bool"
      - "validate_color(color: str) -> bool"
      - "validate_format(format: str) -> bool"

  validation_model:
    location: "models.py"
    class: "SocialTemplate"
    fields:
      font_face: str
      font_size: int
      text_position_xy: tuple[int, int]
      text_fill: str
      background_type: str # 'solid' or 'gradient'
      gradient_colors: list[str] | None
      max_chars_per_line: int | None
      v_align: str # 'top', 'middle', 'bottom'
      h_align: str # 'left', 'center', 'right'

    rationale: "Fail fast on template errors (not KeyError at runtime)"

  error_handling:
    template_not_found:
      action: "Fallback to 'modern.json' + log warning"
      message: "Template '{style}' not found, using 'modern'"

    font_missing:
      action: "Use Pillow default font + log warning"
      message: "Font '{font_face}' not found, using default"

    invalid_color:
      action: "Raise ValueError with suggestion"
      message: "Invalid color '{color}'. Use: blue, red, green, purple, or hex (#RRGGBB)"

  template_reference:
    location: "templates/social/"
    available:
      - "modern.json: Clean, tech-forward, gradient background"
      - "bold.json: High-impact, solid color, large font"
      - "minimal.json: Whitespace, small font, elegant"

  testing:
    unit:
      - "test_load_valid_template"
      - "test_load_invalid_template_fallback"
      - "test_text_wrapping_edge_cases"

    integration:
      - "test_generate_post_all_styles"
      - "test_custom_hex_color"
      - "test_output_file_created"
      - "test_social_stdin_pipe"

