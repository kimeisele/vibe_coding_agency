# ============================================================================
# CLI ORCHESTRATION (Add to existing cli: section in BLUEPRINT.yaml)
# ============================================================================

cli:
  # ... existing content ...

  orchestration_patterns:
    social_with_ai_background:
      command: "toolkit social 'text' --bg-concept 'concept'"

      flow:
        step_1: "cli_app.py receives --bg-concept"
        step_2: "If registry: prefix → load from registry, else continue"
        step_3: "cli_app.py calls mistral.enhance_image_prompt(concept)"
        step_4: "cli_app.py calls image_gen.generate_image(enhanced_prompt)"
        step_5: "cli_app.py calls social.generate_social_post(text, background_image_path=...)"
        step_6: "cli_app.py displays cost + paths"

      implementation: |
        @app.command()
        def social_cmd(..., bg_concept: Optional[str] = None, bg_seed: Optional[int] = None):
            config = ctx.obj
            background_image_path = None
            total_cost = 0.0

            if bg_concept:
                # Step 2: Registry check
                if bg_concept.startswith("registry:"):
                    concept_id = bg_concept.replace("registry:", "")
                    actual_prompt = _load_from_registry("image-concepts", concept_id)
                else:
                    # Step 3: Mistral enhancement
                    actual_prompt = mistral.enhance_image_prompt(bg_concept, config)

                # Step 4: Image generation
                img_result = image_gen.generate_image(
                    prompt=actual_prompt,
                    seed=bg_seed,
                    config=config
                )
                background_image_path = Path(img_result["path"])
                total_cost = img_result["cost"]

            # Step 5: Social post generation
            result = social.generate_social_post(
                text=text,
                ...,
                background_image_path=background_image_path,
                config=config
            )

            # Step 6: Display
            typer.secho(f"✅ Social post: {result['path']}", fg="green")
            if total_cost > 0:
                typer.secho(f"💰 Cost: ${total_cost:.4f}", fg="cyan")

  error_display:
    api_errors:
      pattern: "Catch exceptions from modules, display user-friendly"
      example: |
        try:
            result = image_gen.generate_image(...)
        except ValueError as e:
            # Missing token, invalid params
            typer.secho(f"❌ Configuration error: {e}", fg="red")
            raise typer.Exit(1)
        except RuntimeError as e:
            # API errors, timeouts
            typer.secho(f"❌ API error: {e}", fg="red")
            raise typer.Exit(1)

