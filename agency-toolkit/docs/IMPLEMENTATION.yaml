briefing:
  command: "briefing"
  files:
    - "agency_toolkit/briefing.py (backward-compat wrapper)"
    - "agency_toolkit/core/briefing/generator.py (main logic)"
    - "agency_toolkit/core/briefing/template_loader.py (template handling)"
    - "agency_toolkit/core/briefing/pdf_builder.py (PDF generation)"
    - "agency_toolkit/core/briefing/validators.py (validation)"

  responsibility: "Generate project briefing PDFs from dynamic templates"

  function_structure:
    # Location: agency_toolkit/core/briefing/generator.py
    public:
      - "generate_briefing(type, mode, data_source, config) -> dict"

    # Location: agency_toolkit/core/briefing/template_loader.py
    template_module:
      - "load_briefing_questions(type: str) -> dict"
      - "get_available_templates() -> list[str]"

    # Location: agency_toolkit/core/briefing/generators.py
    collection_module:
      - "collect_interactive(questions: dict) -> BriefingData"
      - "load_from_json(path: Path) -> BriefingData"

    # Location: agency_toolkit/core/briefing/pdf_builder.py
    pdf_module:
      - "generate_pdf(data: BriefingData, output_dir) -> Path"
      - "generate_markdown(data: BriefingData, output_dir) -> Path"

  template_definition:
    location: "templates/briefing/"
    rationale: "JSON files define the *questions* asked"
    structure: |
      {
        "rationale": "Brief explanation of template purpose",
        "required": [
          {"key": "client_name", "prompt": "Client Name"},
          {"key": "project_name", "prompt": "Project Name"}
        ],
        "optional": [
          {"key": "budget", "prompt": "Budget"},
          {"key": "hosting_provider", "prompt": "Hosting Provider"}
        ]
      }
    logic: "_collect_interactive() uses this JSON to build prompts"

  validation_model:
    location: "models.py"
    class: "BriefingData"
    fields:
      client_name: str
      project_name: str
      project_type: str
      deadline: date
      budget: float | None
      objectives: str | None
      target_audience: str | None
      deliverables: list[str]
      notes: str | None
      # (Pydantic model remains a superset of all possible fields)

    rationale: "Type safety for all possible fields; template defines what's *required* at runtime"

  error_handling:
    template_not_found:
      action: "Fallback to default.json + log warning"
      message: "Briefing template '{type}' not found, using 'default'"

    invalid_date:
      action: "Re-prompt with example"
      message: "Invalid date format. Use: YYYY-MM-DD (e.g., 2024-12-31)"

    missing_required:
      action: "Re-prompt with hint (from template)"
      message: "Field '{field}' is required. Please provide a value."

    json_parse_error:
      action: "Show line number + suggestion"
      message: "JSON error at line {line}: {error}. Check commas and quotes."

  template_reference:
    location: "templates/briefing/"
    available:
      - "default.json: Generic 5 W's (Who, What, When, Where, Why)"
      - "web.json: Web project specific (CMS, hosting, SEO)"
      - "video.json: Video production specific (format, duration, style)"

  testing:
    unit:
      - "test_validate_briefing_data"
      - "test_invalid_date_format"
      - "test_json_loading"
      - "test_load_briefing_template"

    integration:
      - "test_interactive_mode_flow (default)"
      - "test_interactive_mode_web_type"
      - "test_json_mode_end_to_end"
      - "test_pdf_file_created"

