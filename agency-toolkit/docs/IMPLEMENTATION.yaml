config:
  file: "agency_toolkit/config.py"

  epic_9_updates:
    load_config:
      signature: "load_config(config_path: Path | None = None) -> Config"
      priority_chain:
        - "1. Project config (./config.toml in CWD) - highest"
        - "2. User config (~/.config/agency-toolkit/config.toml)"
        - "3. Explicit config_path parameter"
        - "4. Application defaults - lowest"
      merge_logic: "Higher-priority configs override, non-conflicting settings merge"
      implementation: "Path.cwd() for project, Path.home() for user, dict.update() for merge"

  allowed_functions:
    - "load_config() -> Config"
    - "get_logger(name: str) -> logging.Logger"
    - "ensure_output_dir(path: Path) -> None"
    - "load_template(template_dir: str, template_name: str, fallback: str) -> dict | list"
    - "get_dynamic_choices_from_path(path: Path, suffix: str) -> list[str]"
    - "get_dynamic_choices_from_config(config: Config, section: str) -> list[str]"

  forbidden:
    - "Business logic (belongs in modules)"
    - "CLI argument parsing (belongs in cli_app.py)"
    - "Module-specific helpers (keep in module)"

  rationale: "Utils should be boring infrastructure, not a dumping ground"

# ============================================================================
# VALIDATION MODELS (Pydantic)
# ============================================================================

models:
  file: "agency_toolkit/models.py"

  purpose: "Fail fast with clear errors, not KeyError at runtime"

  classes:
    Config:
      fields:
        - "output_dir: Path"
        - "social_style: str"
        - "social_color: str"
        - "briefing_type: str"
        - "mistral_model: str"
        - "mistral_profiles: dict"
        - "json_output: bool"

    SocialTemplate:
      class: "SocialTemplate (v5.0 - Responsive)"
      fields:
        font_face: str
        font_size_ratio: float | None  # e.g., 0.06 = 6% of image height
        padding_ratio: float         # e.g., 0.1 = 10% margin
        text_x_ratio: float          # e.g., 0.5 = center
        text_y_ratio: float          # e.g., 0.5 = center
        text_fill: str
        v_align: str                 # 'top', 'middle', 'bottom'
        h_align: str                 # 'left', 'center', 'right'
        background_type: str         # 'solid' or 'gradient'
        font_size: int | None        # DEPRECATED
        text_position_xy: tuple | None # DEPRECATED
      rationale: "Responsive layouts that adapt to different aspect ratios (square, story, landscape) instead of fixed pixel values. Fail fast on template errors."

    BriefingData: # (Superset of all possible fields)
      fields:
        - "client_name: str"
        - "project_name: str"
        - "deadline: date"
        - ... (all other fields as optional)

  validation_strategy:
    when: "At data load time (template, user input)"
    how: "Pydantic parse_file / parse_obj"
    error: "ValidationError → formatted for user"

