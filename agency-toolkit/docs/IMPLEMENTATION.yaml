        description: "Pre-optimized prompts for image generation"
        version: "1.0"
        type: "prompts"

      entries:
        format: "{ 'concept-id': { 'name', 'prompt', 'tags' } }"

        example: |
          "tech-startup": {
            "name": "Tech Startup Office",
            "prompt": "modern minimalist tech startup office, large windows...",
            "tags": ["tech", "office", "professional"]
          }

    usage:
      cli: "toolkit social 'text' --bg-concept registry:tech-startup"

      loading_logic: |
        def _load_from_registry(registry_type: str, entry_id: str) -> str:
            path = Path(f"registry/prompts/{registry_type}.json")
            data = json.loads(path.read_text())
            return data["entries"][entry_id]["prompt"]

    initial_entries:
      - "tech-startup"
