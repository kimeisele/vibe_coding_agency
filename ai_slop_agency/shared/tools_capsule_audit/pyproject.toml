[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meta-audit"
version = "0.2.0"
description = "A CLI tool to scan Python projects, create versioned capsules, and analyze AI slop patterns with cross-project detection."
authors = [{name = "Capsule Audit Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "radon>=6.0.1",      # Complexity metrics analyzer
    "bandit>=1.7.5",     # Security vulnerability scanner
    "jsonschema>=4.0",   # JSON schema validation for prompts
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark",
    "ruff",
    "mypy>=1.0",
    "black",
]
google = [
    "google-generativeai>=0.4.0",
]
mistral = [
    "mistralai>=0.1.0",
]
ollama = [
    "requests>=2.31.0",
]
providers = [
    "google-generativeai>=0.4.0",
    "mistralai>=0.1.0",
    "requests>=2.31.0",
]

[project.scripts]
meta-audit = "meta_audit.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_audit"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "phase1: Phase 1 tests (collectors: complexity, security, ai_slop)",
    "phase2: Phase 2 tests (reports and aggregation)",
    "phase3: Phase 3 tests (batch processing)",
    "phase4: Phase 4 tests (cross-project analysis)",
    "phase5: Phase 5 tests (LLM orchestration)",
    "unit: Unit tests",
    "integration: Integration tests",
    "production: Production workflow tests",
    "skip_ci: Skip in CI/CD (environment-specific tests)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]