name: Meta-Audit CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  regression-tests:
    name: Regression Tests & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov radon

      - name: Run smoke tests
        run: python -m pytest tests/smoke_cli.py -v --tb=short

      - name: Run regression tests (golden masters)
        run: python -m pytest tests/regression/ -v --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short

      - name: Run all tests with coverage
        run: python -m pytest tests/ -v --cov=meta_audit --cov-report=term --tb=short

      - name: Check code complexity (radon)
        continue-on-error: false
        run: |
          echo "=== Cyclomatic Complexity Check ==="
          radon cc src/meta_audit -s --total-average || true
          echo ""
          echo "Failing if any module exceeds CC=10..."
          if radon cc src/meta_audit -s | grep -E "^\s+[A-Z].*\s+(15|16|17|18|19|[2-9][0-9]|[0-9]{3,})\s+" > /dev/null 2>&1; then
            echo "❌ FAIL: Code complexity exceeds threshold (CC > 10)"
            radon cc src/meta_audit -s
            exit 1
          fi
          echo "✅ Code complexity acceptable"

      - name: Lint with flake8
        continue-on-error: false
        run: |
          pip install flake8
          echo "=== Linting Check ==="
          flake8 src/meta_audit --max-line-length=120 --ignore=E501,W503 --count || exit 1
          echo "✅ Linting passed"

  pydantic-check:
    name: Check Pydantic Deprecations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check for Pydantic deprecation warnings
        run: |
          echo "=== Pydantic V1 Deprecation Check ==="
          python -c "
          import warnings
          warnings.simplefilter('error')
          try:
              import meta_audit
              print('✅ No Pydantic deprecation warnings')
          except DeprecationWarning as e:
              if 'Pydantic' in str(e):
                  print('⚠️  Pydantic deprecation found:')
                  print(str(e))
                  print('Note: Will need Pydantic V2 migration before V3 release')
              raise
          " 2>&1 || echo "Pydantic deprecations detected (expected, schedule for future)"

  security-baseline:
    name: Security Baseline Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run security scan with Bandit
        continue-on-error: true
        run: |
          echo "=== Security Scan (Bandit) ==="
          bandit -r src/meta_audit -f csv > bandit-report.csv 2>&1 || true
          if [ -f bandit-report.csv ]; then
            echo "Security issues found (for review):"
            head -20 bandit-report.csv || true
          fi
